# Alembic 迁移工具配置。
[alembic]
# 迁移脚本目录；附件未包含该目录。
script_location = alembic
# 将当前目录加入模块搜索路径，便于导入项目。
prepend_sys_path = .
# 使用操作系统路径分隔符解释迁移路径配置。
version_path_separator = os
# 留空：真实连接串由 alembic/env.py 从 app.core.config 读取
# 连接串留空，由尚未提供的 alembic/env.py 读取应用配置。
sqlalchemy.url =

# 注册日志记录器。
[loggers]
# 列出该节注册的组件名称。
keys = root,sqlalchemy,alembic

# 注册日志输出处理器。
[handlers]
# 列出该节注册的组件名称。
keys = console

# 注册日志格式器。
[formatters]
# 列出该节注册的组件名称。
keys = generic

# 根日志记录器配置。
[logger_root]
# 设置日志级别：WARN 为警告及以上，INFO 含迁移信息，NOTSET 交由上级规则处理。
level = WARN
# 指定日志处理器；空值表示该记录器没有直接绑定的处理器。
handlers = console
# 日志记录器名称；空值对应根记录器。
qualname =

# SQLAlchemy 日志记录器配置。
[logger_sqlalchemy]
# 设置日志级别：WARN 为警告及以上，INFO 含迁移信息，NOTSET 交由上级规则处理。
level = WARN
# 指定日志处理器；空值表示该记录器没有直接绑定的处理器。
handlers =
# 日志记录器名称；空值对应根记录器。
qualname = sqlalchemy.engine

# Alembic 日志记录器配置。
[logger_alembic]
# 设置日志级别：WARN 为警告及以上，INFO 含迁移信息，NOTSET 交由上级规则处理。
level = INFO
# 指定日志处理器；空值表示该记录器没有直接绑定的处理器。
handlers =
# 日志记录器名称；空值对应根记录器。
qualname = alembic

# 控制台日志输出处理器配置。
[handler_console]
# 使用标准输出流日志处理器。
class = StreamHandler
# 将日志写入标准错误流。
args = (sys.stderr,)
# 设置日志级别：WARN 为警告及以上，INFO 含迁移信息，NOTSET 交由上级规则处理。
level = NOTSET
# 选用 generic 日志格式器。
formatter = generic

# 通用日志格式配置。
[formatter_generic]
# 输出级别、记录器名称及消息；级别字段左对齐，宽度与最大长度均为 5。
format = %(levelname)-5.5s [%(name)s] %(message)s
# 时间格式为时:分:秒；当前 format 没有 asctime，因此不会显示时间。
datefmt = %H:%M:%S
