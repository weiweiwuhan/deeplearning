# Keep this file ASCII: Alembic reads it with the OS locale (GBK on some Windows systems).
# Chinese explanations and setup instructions are in README.md.
[alembic]
# Database migration directory.
script_location = alembic
# Add the current project directory to Python's import path.
prepend_sys_path = .
# Split paths using the operating system's separator.
path_separator = os
version_path_separator = os
# The connection URL is loaded by alembic/env.py from app.database.settings.
sqlalchemy.url =

# Register named loggers, handlers and formatters.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

# Root logger: warnings and errors are written to the console.
[logger_root]
level = WARN
handlers = console
qualname =

# SQLAlchemy engine logger inherits the root handler.
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

# Alembic logger also shows migration progress.
[logger_alembic]
level = INFO
handlers =
qualname = alembic

# Console output uses stderr; the formatter is defined below.
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

# Show the log level, logger name and message.
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
# Used if asctime is added to the format above.
datefmt = %H:%M:%S
