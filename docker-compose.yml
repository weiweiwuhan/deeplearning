# 网页版只依赖 PostgreSQL，不再要求 Redis 或微信配置。
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: training
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置数据库密码}
      POSTGRES_DB: training
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U training -d training"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build: .
    env_file:
      - .env
    environment:
      # URL 中使用 postgres 服务名；密码需使用字母数字以避免 URL 转义问题。
      DATABASE_URL: postgresql+psycopg://training:${POSTGRES_PASSWORD:?请设置数据库密码}@postgres:5432/training
      DATA_DIR: /app/data
    ports:
      # 默认只绑定服务器本机；公网访问由 HTTPS 反向代理提供。
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - trainingdata:/app/data
    restart: unless-stopped

volumes:
  pgdata:
  trainingdata:
